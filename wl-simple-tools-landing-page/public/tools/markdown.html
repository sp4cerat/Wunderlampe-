<!doctype html>
<html lang="de" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown → HTML · Toolkit</title>
  <meta name="description" content="Markdown live in HTML rendern, mit Sanitizing und HTML-Kopie." />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <link rel="stylesheet" href="../styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 font-sans antialiased">
  <nav class="border-b border-zinc-900">
    <div class="mx-auto max-w-6xl px-6 py-3 flex items-center gap-3 text-sm">
      <a href="../../index.html" class="flex items-center gap-2 text-zinc-300 hover:text-white">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
        Übersicht</a>
      <span class="text-zinc-600">/</span><span class="text-zinc-400">Markdown → HTML</span>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-6 py-8 space-y-4">
    <header>
      <h1 class="text-2xl font-semibold tracking-tight">Markdown → HTML</h1>
      <p class="mt-1 text-sm text-zinc-400">Live-Vorschau dank <code>marked</code>; HTML-Output wird mit DOMPurify sanitisiert.</p>
    </header>

    <div class="grid lg:grid-cols-2 gap-4">
      <div class="rounded-xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-sm font-medium text-zinc-300">Markdown</h2>
          <button id="copyMd" class="text-xs rounded border border-zinc-800 hover:bg-zinc-800 px-2 py-1">Kopieren</button>
        </div>
        <textarea id="src" rows="22" spellcheck="false" class="w-full rounded-md bg-zinc-950 border border-zinc-800 focus:border-emerald-400 focus:ring-0 px-3 py-2 text-sm font-mono"></textarea>
      </div>
      <div class="rounded-xl border border-zinc-800 bg-zinc-900/50 p-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-sm font-medium text-zinc-300">Vorschau</h2>
          <div class="flex gap-2">
            <button id="copyHtml" class="text-xs rounded border border-zinc-800 hover:bg-zinc-800 px-2 py-1">HTML kopieren</button>
            <button id="downloadHtml" class="text-xs rounded border border-zinc-800 hover:bg-zinc-800 px-2 py-1">Download</button>
          </div>
        </div>
        <article id="preview" class="prose prose-invert prose-zinc max-w-none rounded-md bg-zinc-950 border border-zinc-800 p-4 min-h-[34rem] overflow-auto"></article>
      </div>
    </div>
  </main>

  <script src="../app.js"></script>
  <script>
    const src = document.getElementById('src');
    const preview = document.getElementById('preview');
    src.value = `# Hallo Markdown\n\n**Live-Preview** mit \`marked\`. Schreib hier Markdown — rechts erscheint der gerenderte HTML-Output.\n\n- Listen funktionieren\n- Tabellen, [Links](https://example.com), \`Code\`\n- > Zitate\n\n\`\`\`js\nfunction hi(name) {\n  return \`Hallo, \${name}!\`;\n}\n\`\`\``;

    function render() {
      const html = marked.parse(src.value, { gfm: true, breaks: false });
      preview.innerHTML = DOMPurify.sanitize(html);
    }
    src.addEventListener('input', render);
    document.getElementById('copyMd').onclick = () => Toolkit.copy(src.value);
    document.getElementById('copyHtml').onclick = () => Toolkit.copy(DOMPurify.sanitize(marked.parse(src.value, { gfm: true })));
    document.getElementById('downloadHtml').onclick = () => {
      const html = `<!doctype html><html><head><meta charset="utf-8"><title>Markdown Export</title></head><body>${DOMPurify.sanitize(marked.parse(src.value,{gfm:true}))}</body></html>`;
      Toolkit.download('markdown.html', html, 'text/html');
    };
    render();
  </script>
</body>
</html>
