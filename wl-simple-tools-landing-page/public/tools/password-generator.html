<!doctype html>
<html lang="de" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Passwort-Generator · Toolkit</title>
  <meta name="description" content="Sichere Passwörter und Tokens via Web-Crypto erzeugen — direkt im Browser." />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 font-sans antialiased">

  <nav class="border-b border-zinc-900">
    <div class="mx-auto max-w-5xl px-6 py-3 flex items-center gap-3 text-sm">
      <a href="../../index.html" class="flex items-center gap-2 text-zinc-300 hover:text-white">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
        Übersicht
      </a>
      <span class="text-zinc-600">/</span><span class="text-zinc-400">Passwort-Generator</span>
    </div>
  </nav>

  <main class="mx-auto max-w-3xl px-6 py-8 space-y-6">
    <header>
      <h1 class="text-2xl font-semibold tracking-tight">Passwort &amp; Token Generator</h1>
      <p class="mt-1 text-sm text-zinc-400">Erzeugt mit <code class="text-zinc-300">crypto.getRandomValues</code>. Nichts verlässt deinen Browser.</p>
    </header>

    <div class="rounded-xl border border-zinc-800 bg-zinc-900/50 p-5 space-y-4">
      <div class="grid sm:grid-cols-2 gap-4">
        <label class="block">
          <span class="text-xs uppercase tracking-wider text-zinc-400">Länge</span>
          <div class="mt-2 flex items-center gap-3">
            <input id="len" type="range" min="6" max="128" value="20" class="grow" />
            <input id="lenNum" type="number" min="6" max="128" value="20" class="w-16 rounded-md bg-zinc-950 border border-zinc-800 px-2 py-1 text-sm" />
          </div>
        </label>
        <label class="block">
          <span class="text-xs uppercase tracking-wider text-zinc-400">Anzahl</span>
          <input id="count" type="number" min="1" max="50" value="5" class="mt-2 w-full rounded-md bg-zinc-950 border border-zinc-800 px-3 py-2 text-sm" />
        </label>
      </div>

      <div class="grid sm:grid-cols-2 gap-y-2 gap-x-6 text-sm">
        <label class="inline-flex items-center gap-2"><input id="lower" type="checkbox" checked class="rounded border-zinc-700 bg-zinc-950 text-emerald-500"> Kleinbuchstaben (a–z)</label>
        <label class="inline-flex items-center gap-2"><input id="upper" type="checkbox" checked class="rounded border-zinc-700 bg-zinc-950 text-emerald-500"> Großbuchstaben (A–Z)</label>
        <label class="inline-flex items-center gap-2"><input id="digit" type="checkbox" checked class="rounded border-zinc-700 bg-zinc-950 text-emerald-500"> Ziffern (0–9)</label>
        <label class="inline-flex items-center gap-2"><input id="symbol" type="checkbox" class="rounded border-zinc-700 bg-zinc-950 text-emerald-500"> Sonderzeichen (!@#…)</label>
        <label class="inline-flex items-center gap-2"><input id="excludeSimilar" type="checkbox" class="rounded border-zinc-700 bg-zinc-950 text-emerald-500"> Ähnliche ausschließen (0/O 1/l/I)</label>
        <label class="inline-flex items-center gap-2"><input id="hex" type="checkbox" class="rounded border-zinc-700 bg-zinc-950 text-emerald-500"> Nur Hex-Token (0–9 a–f)</label>
      </div>

      <div class="flex gap-2">
        <button id="gen" class="rounded-md bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-medium text-sm px-4 py-2">Generieren</button>
        <button id="copyAll" class="rounded-md border border-zinc-800 hover:bg-zinc-800 text-sm px-3 py-2">Alle kopieren</button>
      </div>
    </div>

    <div class="rounded-xl border border-zinc-800 bg-zinc-900/50 p-5">
      <h2 class="text-sm font-medium text-zinc-300 mb-3">Ergebnisse</h2>
      <ul id="out" class="space-y-2"></ul>
    </div>
  </main>

  <script src="../app.js"></script>
  <script>
    const lower = 'abcdefghijklmnopqrstuvwxyz';
    const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const digit = '0123456789';
    const symbol = '!@#$%^&*()-_=+[]{};:,.?/~';
    const similar = /[O0Il1|`'"]/g;

    const $ = id => document.getElementById(id);

    function buildAlphabet() {
      if ($('hex').checked) return '0123456789abcdef';
      let a = '';
      if ($('lower').checked) a += lower;
      if ($('upper').checked) a += upper;
      if ($('digit').checked) a += digit;
      if ($('symbol').checked) a += symbol;
      if ($('excludeSimilar').checked) a = a.replace(similar, '');
      return a;
    }

    // Cryptographically uniform pick from `alphabet`.
    function randomChar(alphabet) {
      const max = Math.floor(0xFFFFFFFF / alphabet.length) * alphabet.length;
      const buf = new Uint32Array(1);
      while (true) {
        crypto.getRandomValues(buf);
        if (buf[0] < max) return alphabet[buf[0] % alphabet.length];
      }
    }

    function generate() {
      const alphabet = buildAlphabet();
      if (!alphabet) { Toolkit.toast('Mindestens eine Zeichenklasse aktivieren'); return; }
      const len = Math.max(6, Math.min(128, parseInt($('lenNum').value, 10) || 20));
      const count = Math.max(1, Math.min(50, parseInt($('count').value, 10) || 1));
      const out = $('out'); out.innerHTML = '';
      for (let i = 0; i < count; i++) {
        let pw = '';
        for (let j = 0; j < len; j++) pw += randomChar(alphabet);
        out.appendChild(renderRow(pw));
      }
    }

    function strength(pw) {
      const sets = [/[a-z]/.test(pw), /[A-Z]/.test(pw), /\d/.test(pw), /[^a-zA-Z0-9]/.test(pw)].filter(Boolean).length;
      const entropy = pw.length * Math.log2(Math.max(2, ($('hex').checked ? 16 : (sets >= 4 ? 80 : sets >= 3 ? 62 : sets >= 2 ? 36 : 26))));
      if (entropy < 60) return ['Schwach', 'text-rose-400'];
      if (entropy < 80) return ['Solide', 'text-amber-300'];
      if (entropy < 110) return ['Stark', 'text-emerald-300'];
      return ['Sehr stark', 'text-emerald-400'];
    }

    function renderRow(pw) {
      const li = document.createElement('li');
      li.className = 'group flex items-center gap-2 rounded-md border border-zinc-800 bg-zinc-950 px-3 py-2';
      const code = document.createElement('code'); code.className = 'grow font-mono text-sm break-all'; code.textContent = pw;
      const [label, cls] = strength(pw);
      const tag = document.createElement('span'); tag.className = 'text-xs ' + cls; tag.textContent = label;
      const btn = document.createElement('button');
      btn.className = 'opacity-60 group-hover:opacity-100 text-xs rounded border border-zinc-800 hover:bg-zinc-800 px-2 py-1';
      btn.textContent = 'Kopieren';
      btn.onclick = () => Toolkit.copy(pw);
      li.append(code, tag, btn);
      return li;
    }

    $('len').addEventListener('input', e => $('lenNum').value = e.target.value);
    $('lenNum').addEventListener('input', e => $('len').value = e.target.value);
    $('hex').addEventListener('change', e => {
      const off = e.target.checked;
      ['lower','upper','digit','symbol','excludeSimilar'].forEach(id => $(id).disabled = off);
    });
    $('gen').onclick = generate;
    $('copyAll').onclick = () => {
      const items = [...document.querySelectorAll('#out code')].map(c => c.textContent).join('\n');
      if (items) Toolkit.copy(items);
    };
    generate();
  </script>
</body>
</html>
